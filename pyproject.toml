[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "two-tower-confounding"
version = "0.1.0"
description = "Research code for doubly robust learning-to-rank experiments."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "flax>=0.10.7,<0.11",
    "hydra-core>=1.3,<2.0",
    "jax>=0.6,<0.7",
    "numpy>=1.26,<3",
    "omegaconf>=2.3,<3",
    "optax>=0.2.5,<0.3",
    "orbax-checkpoint>=0.11,<0.12",
    "pandas>=2.2,<3",
    "pyarrow>=15,<20",
    "rax>=0.4,<0.5",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
    "torch>=2.4,<3",
    "tqdm>=4.66,<5",
    "hydra-submitit-launcher>=1.2,<2",
    "matplotlib>=3.8,<4",
]

[project.scripts]
two-tower-run = "run:main"
two-tower-estimate-position-bias = "estimate_position_bias:main"
two-tower-compare-propensity = "compare_propensity_param:main"

[tool.setuptools]
py-modules = ["compare_propensity_param", "estimate_position_bias", "run"]

[tool.setuptools.packages.find]
include = ["feature_based_propensities_for_ULTR*", "result_parsing*"]
