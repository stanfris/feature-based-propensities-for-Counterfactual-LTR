hydra:
  run:
    dir: .
  sweep:
    dir: results/${experiment}
    subdir: ${hydra.job.override_dirname}
  launcher:
    submitit_folder: ${hydra.sweep.dir}/.submitit/%j
    timeout_min: 400
    cpus_per_task: 32
    gpus_per_node: null
    tasks_per_node: 1
    mem_gb: 56
    nodes: 1
    name: ${hydra.job.name}
    stderr_to_stdout: false
    _target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher
    partition: rome
    qos: null
    comment: null
    constraint: null
    exclude: null
    gres: null
    cpus_per_gpu: null
    gpus_per_task: null
    mem_per_gpu: null
    mem_per_cpu: null
    account: null
    signal_delay_s: 120
    max_num_timeout: 0
    additional_parameters: {}
    array_parallelism: 1000
    setup:
    - module purge
    - module load 2023
    - module load CUDA/12.4.0
    - source .venv/binactivate
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - experiment=true_baselines
    - data=yahoo
    - random_state=40,41,42
    - policy_temperature=0.5
    - ips.model=logging_policy
    - propensity_model=frequency-based
    - ips.n_sessions=100
    - data.preprocessor.top_x=25
    - +launcher=slurmcpu
  job:
    name: run
    chdir: true
    override_dirname: +launcher=slurmcpu,data.preprocessor.top_x=25,data=yahoo,experiment=true_baselines,ips.model=logging_policy,ips.n_sessions=100,policy_temperature=0.5,propensity_model=frequency-based,random_state=40,41,42
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys:
        - relevance
        - relevance_tower
        - num_groups
        - D
        - s_group
        - label_type
        - bias_type
        - query_sampling_ratios
        - propensity_classifier_layers
        - propensity_classifier_hidden_units
        - propensity_classifier_dropout
        - cosine_threshold
        - kmeans_iters
        - min_cluster_size
        - kmeans_iters
        - query_sampling_ratios
        - knn_k
        - ips.output_path
        - ips.save_subdir
        - ips.model_params.eps
        - ips.model_params.model_output_multiplier
        - ips.model_params.relevance_tower.layers
        - ips.model_params.relevance_tower.hidden_units
        - ips.model_params.relevance_tower.dropout
        - ips.trainer.trainer_type
        - ips.trainer.max_epochs
        - ips.trainer.early_stop_diff
        - ips.trainer.early_stop_per_epochs
        - ips.trainer.n_eval_samples
        - ips.trainer.n_samples
        - ips.trainer.learning_rate
        - ips.trainer.clip_multiplier
        - ips.trainer.print_updates
        - ips.propensity.checkpoint_dir
        - ips.propensity.debug_compare_true
        - ips.propensity.dataloader
        - propensity_model.regression.layers
        - propensity_model.regression.hidden_units
        - propensity_model.regression.dropout
        - propensity_model.classifier.layers
        - propensity_model.classifier.hidden_units
        - propensity_model.classifier.dropout
        - ips.force_single_sample
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /gpfs/home5/sfris1/Doubly-Robust-Optimization-With-Two-Tower-Models
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /gpfs/home5/sfris1/Doubly-Robust-Optimization-With-Two-Tower-Models/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      launcher: slurmcpu
      ips: default
      propensity_model: frequency-based
      relevance_tower: deep
      bias_tower: embedding
      logging_policy_sampler: e_greedy
      logging_policy_ranker: deep
      data: yahoo
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: submitit_slurm
      hydra/output: default
  verbose: false
dataset_dir: ~/ltr_datasets
experiment: true_baselines
random_state: 42
device: cpu
use_cross_validation: false
features: all
relevance: original
relevance_noise: 0.0
relevance_quantization: false
drop0rel: false
train_clicks: 5000000
val_clicks: 2500000
test_set_mode: label_only
test_clicks: 500000
persist_datasets: false
policy_strength: 1.0
policy_temperature: 0.5
bias_strength: 1.0
query_sampling_ratios: null
simulation:
  max_label: 10
deterministic_groups: false
use_wandb: true
use_propensity_weighting: false
data:
  dataset:
    _target_: two_tower_confounding.data.datasets.yahoo.YahooC14
    base_dir: ${dataset_dir}
  preprocessor:
    _target_: two_tower_confounding.data.preprocessing.Preprocessor
    normalize_features: false
    generate_query_document_ids: true
    store_separate_lp_query_doc_features: false
    disjoint_query_chunk_mode: false
    documents_per_chunk: 25
    top_x: 25
    max_documents_per_query: 80
    drop0rel: ${drop0rel}
    random_state: ${random_state}
    relevance: ${relevance}
    features: ${features}
    relevance_noise: ${relevance_noise}
    relevance_quantization: ${relevance_quantization}
logging_policy_ranker:
  _target_: two_tower_confounding.simulation.simulator.NeuralRanker
  model_type: deep
  policy_strength: ${policy_strength}
  random_state: ${random_state}
  training_data_percentage: 10.0
logging_policy_sampler:
  _target_: two_tower_confounding.simulation.simulator.EGreedySampler
  policy_temperature: ${policy_temperature}
  random_state: ${random_state}
bias_tower:
  _target_: two_tower_confounding.models.towers.EmbeddingBiasTower
  _partial_: true
  positions: ???
  rngs: ???
relevance_tower:
  _target_: two_tower_confounding.models.towers.DeepRelevanceTower
  _partial_: true
  features: ???
  layers: 2
  hidden_units: 32
  dropout: 0
  rngs: ???
propensity_model:
  type: frequency-based
ips:
  model: logging_policy
  output_path: ips_results.json
  save_subdir: ips_datasets
  n_sessions: 100
  n_session_percentage: null
  force_single_sample: false
  display_histogram_dir: display_histograms
  display_histogram_max: 100
  debug: false
  model_params:
    eps: 1.0e-08
    model_output_multiplier: 1.0
    relevance_tower:
      layers: 2
      hidden_units: 32
      dropout: 0.1
  regression:
    method: regression
    model:
      layers: 3
      hidden_units: 256
      dropout: 0.1
    trainer:
      batch_size: 1024
      max_epochs: 200
      early_stop_diff: 0.001
      early_stop_per_epochs: 3
      learning_rate: 0.001
      eps: 1.0e-06
      print_updates: true
      rescale_target_mean: 0.5
      rescale_max_iter: 60
    two_tower:
      checkpoint_dir: checkpoint
      save_checkpoint: true
  two_tower_trainer:
    learning_rate: 0.003
    epochs: 500
    batch_size: 512
    min_delta: 1.0e-05
  trainer:
    trainer_type: pl-rank
    max_epochs: 100
    early_stop_diff: 0.001
    early_stop_per_epochs: 3
    early_stop_min_epochs: 15
    patience: 2
    eval_first_epoch: false
    eval_train_split: false
    eval_max_queries: ${oc.select:data.data_eval_max_queries,null}
    n_grad_samples_dynamic_fallback: 100
    n_eval_samples: ${oc.select:data.data_n_eval_samples,100}
    n_samples: 100
    learning_rate: 1.0e-05
    clip_multiplier: 1.0
    clip_base: 10.0
    clip_propensity: false
    print_updates: true
    use_wandb: true
    log_freq: 100
  eval_label_scale: 0.25
  propensity:
    method: ${propensity_model.type}
    checkpoint_dir: classifier_propensity_model_checkpoint
    max_train_samples: 50000
    inference_batch_size: 512
    debug_compare_true: false
    dataloader:
      num_workers: 1
      prefetch_factor: 2
      persistent_workers: true
      pin_memory: false
