hydra:
  run:
    dir: .
  sweep:
    dir: results/${experiment}
    subdir: ${hydra.job.override_dirname}
  launcher:
    submitit_folder: ${hydra.sweep.dir}/.submitit/%j
    timeout_min: 30
    cpus_per_task: 16
    gpus_per_node: null
    tasks_per_node: 1
    mem_gb: 28
    nodes: 1
    name: ${hydra.job.name}
    stderr_to_stdout: false
    _target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher
    partition: rome
    qos: null
    comment: null
    constraint: null
    exclude: null
    gres: null
    cpus_per_gpu: null
    gpus_per_task: null
    mem_per_gpu: null
    mem_per_cpu: null
    account: null
    signal_delay_s: 120
    max_num_timeout: 0
    additional_parameters: {}
    array_parallelism: 100
    setup:
    - module purge
    - module load 2023
    - module load CUDA/12.4.0
    - source .venv/bin/activate
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - experiment=compare_propensity_estimators_counts
    - data=mslr30k
    - relevance=deep
    - logging_policy_ranker=deep
    - relevance_tower=deep
    - policy_strength=1.0
    - policy_temperature=0.5
    - random_state=2023
    - propensity_model=knn
    - knn_k=1
    - +launcher=slurmcpu
  job:
    name: compare_propensity_param
    chdir: true
    override_dirname: +launcher=slurmcpu,data=mslr30k,experiment=compare_propensity_estimators_counts,logging_policy_ranker=deep,policy_temperature=0.5,propensity_model=knn,relevance=deep,relevance_tower=deep
    id: '19838210'
    num: 0
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys:
        - freeze_bias_tower
        - param_shift
        - param_idx
        - single_param
        - save_test_datasets
        - load_test_datasets
        - test_dataset_name
        - test_click_dataset_name
        - num_groups
        - D
        - s_group
        - label_type
        - policy_strength
        - random_state
        - use_baidu
        - bias_type
        - propensity_classifier_layers
        - propensity_classifier_hidden_units
        - propensity_classifier_dropout
        - cosine_threshold
        - kmeans_iters
        - num_groups
        - min_cluster_size
        - kmeans_iters
        - query_sampling_ratios
        - knn_k
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /gpfs/home5/sfris1/Doubly-Robust-Optimization-With-Two-Tower-Models
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /gpfs/home5/sfris1/Doubly-Robust-Optimization-With-Two-Tower-Models/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /gpfs/home5/sfris1/Doubly-Robust-Optimization-With-Two-Tower-Models/results/compare_propensity_estimators_counts/+launcher=slurmcpu,data=mslr30k,experiment=compare_propensity_estimators_counts,logging_policy_ranker=deep,policy_temperature=0.5,propensity_model=knn,relevance=deep,relevance_tower=deep
    choices:
      launcher: slurmcpu
      propensity_model: knn
      relevance_tower: deep
      bias_tower: embedding
      logging_policy_sampler: e_greedy
      logging_policy_ranker: deep
      data: mslr30k
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: submitit_slurm
      hydra/output: default
  verbose: false
