dataset_dir: ~/ltr_datasets
experiment: real_targets
random_state: 41
device: cpu
use_cross_validation: false
features: all
relevance: original
relevance_noise: 0.0
relevance_quantization: false
drop0rel: false
train_clicks: 5000000
val_clicks: 2500000
test_set_mode: label_only
test_clicks: 500000
persist_datasets: false
policy_strength: 1.0
policy_temperature: 0.5
bias_strength: 1.0
query_sampling_ratios: null
simulation:
  max_label: 10
deterministic_groups: false
use_wandb: true
use_propensity_weighting: false
data:
  dataset:
    _target_: two_tower_confounding.data.datasets.mslr.MSLR30K
    base_dir: ${dataset_dir}
  preprocessor:
    _target_: two_tower_confounding.data.preprocessing.Preprocessor
    normalize_features: true
    generate_query_document_ids: true
    store_separate_lp_query_doc_features: false
    documents_per_chunk: 25
    top_x: 25
    max_documents_per_query: 200
    disjoint_query_chunk_mode: false
    drop0rel: ${drop0rel}
    random_state: ${random_state}
    relevance: ${relevance}
    features: ${features}
    relevance_noise: ${relevance_noise}
    relevance_quantization: ${relevance_quantization}
logging_policy_ranker:
  _target_: two_tower_confounding.simulation.simulator.NeuralRanker
  model_type: deep
  policy_strength: ${policy_strength}
  random_state: ${random_state}
  training_data_percentage: 10.0
logging_policy_sampler:
  _target_: two_tower_confounding.simulation.simulator.EGreedySampler
  policy_temperature: ${policy_temperature}
  random_state: ${random_state}
bias_tower:
  _target_: two_tower_confounding.models.towers.EmbeddingBiasTower
  _partial_: true
  positions: ???
  rngs: ???
relevance_tower:
  _target_: two_tower_confounding.models.towers.DeepRelevanceTower
  _partial_: true
  features: ???
  layers: 2
  hidden_units: 32
  dropout: 0
  rngs: ???
propensity_model:
  type: propensity_mlp_regression
  regression:
    layers: 2
    hidden_units: 128
    dropout: 0.0
  training:
    learning_rate: 0.005
    min_delta: 1.0e-05
    batch_size: 512
ips:
  model: ips
  output_path: ips_results.json
  save_subdir: ips_datasets
  n_sessions: 5000000
  n_session_percentage: null
  force_single_sample: false
  display_histogram_dir: display_histograms
  display_histogram_max: 100
  debug: false
  model_params:
    eps: 1.0e-08
    model_output_multiplier: 1.0
    relevance_tower:
      layers: 2
      hidden_units: 32
      dropout: 0.1
  regression:
    method: regression
    model:
      layers: 3
      hidden_units: 256
      dropout: 0.1
    trainer:
      batch_size: 1024
      max_epochs: 200
      early_stop_diff: 0.001
      early_stop_per_epochs: 3
      learning_rate: 0.001
      eps: 1.0e-06
      print_updates: true
      rescale_target_mean: 0.5
      rescale_max_iter: 60
    two_tower:
      checkpoint_dir: checkpoint
      save_checkpoint: true
  two_tower_trainer:
    learning_rate: 0.003
    epochs: 500
    batch_size: 512
    min_delta: 1.0e-05
  trainer:
    trainer_type: pl-rank
    max_epochs: 100
    early_stop_diff: 0.001
    early_stop_per_epochs: 3
    early_stop_min_epochs: 15
    patience: 2
    eval_first_epoch: false
    eval_train_split: false
    eval_max_queries: ${oc.select:data.data_eval_max_queries,null}
    n_grad_samples_dynamic_fallback: 100
    n_eval_samples: ${oc.select:data.data_n_eval_samples,100}
    n_samples: 100
    learning_rate: 1.0e-05
    clip_multiplier: 1.0
    clip_base: 10.0
    clip_propensity: false
    print_updates: true
    use_wandb: true
    log_freq: 100
  eval_label_scale: 0.25
  propensity:
    method: ${propensity_model.type}
    checkpoint_dir: classifier_propensity_model_checkpoint
    max_train_samples: 50000
    inference_batch_size: 512
    debug_compare_true: false
    dataloader:
      num_workers: 1
      prefetch_factor: 2
      persistent_workers: true
      pin_memory: false
