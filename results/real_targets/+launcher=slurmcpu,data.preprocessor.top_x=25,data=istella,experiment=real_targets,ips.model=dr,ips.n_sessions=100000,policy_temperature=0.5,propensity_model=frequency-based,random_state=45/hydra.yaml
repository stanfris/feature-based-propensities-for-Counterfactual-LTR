hydra:
  run:
    dir: .
  sweep:
    dir: results/${experiment}
    subdir: ${hydra.job.override_dirname}
  launcher:
    submitit_folder: ${hydra.sweep.dir}/.submitit/%j
    timeout_min: 400
    cpus_per_task: 48
    gpus_per_node: null
    tasks_per_node: 1
    mem_gb: 84
    nodes: 1
    name: ${hydra.job.name}
    stderr_to_stdout: false
    _target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher
    partition: rome
    qos: null
    comment: null
    constraint: null
    exclude: null
    gres: null
    cpus_per_gpu: null
    gpus_per_task: null
    mem_per_gpu: null
    mem_per_cpu: null
    account: null
    signal_delay_s: 120
    max_num_timeout: 0
    additional_parameters: {}
    array_parallelism: 1000
    setup:
    - module purge
    - module load 2023
    - export JAX_PLATFORMS=cpu
    - source .venv/bin/activate
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - experiment=real_targets
    - data=istella
    - random_state=45
    - policy_temperature=0.5
    - ips.model=dr
    - propensity_model=frequency-based
    - ips.n_sessions=100000
    - data.preprocessor.top_x=25
    - +launcher=slurmcpu
  job:
    name: run
    chdir: true
    override_dirname: +launcher=slurmcpu,data.preprocessor.top_x=25,data=istella,experiment=real_targets,ips.model=dr,ips.n_sessions=100000,policy_temperature=0.5,propensity_model=frequency-based,random_state=45
    id: '20914379_176'
    num: 176
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys:
        - relevance
        - relevance_tower
        - num_groups
        - D
        - s_group
        - label_type
        - bias_type
        - query_sampling_ratios
        - propensity_classifier_layers
        - propensity_classifier_hidden_units
        - propensity_classifier_dropout
        - cosine_threshold
        - kmeans_iters
        - min_cluster_size
        - kmeans_iters
        - query_sampling_ratios
        - knn_k
        - ips.output_path
        - ips.save_subdir
        - ips.model_params.eps
        - ips.model_params.model_output_multiplier
        - ips.model_params.relevance_tower.layers
        - ips.model_params.relevance_tower.hidden_units
        - ips.model_params.relevance_tower.dropout
        - ips.trainer.trainer_type
        - ips.trainer.max_epochs
        - ips.trainer.early_stop_diff
        - ips.trainer.early_stop_per_epochs
        - ips.trainer.n_eval_samples
        - ips.trainer.n_samples
        - ips.trainer.learning_rate
        - ips.trainer.clip_multiplier
        - ips.trainer.clip_propensity
        - ips.trainer.print_updates
        - ips.propensity.checkpoint_dir
        - ips.propensity.debug_compare_true
        - ips.propensity.dataloader
        - propensity_model.regression.layers
        - propensity_model.regression.hidden_units
        - propensity_model.regression.dropout
        - propensity_model.classifier.layers
        - propensity_model.classifier.hidden_units
        - propensity_model.classifier.dropout
        - ips.force_single_sample
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /gpfs/home5/sfris1/Doubly-Robust-Optimization-With-Two-Tower-Models
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /gpfs/home5/sfris1/Doubly-Robust-Optimization-With-Two-Tower-Models/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /gpfs/home5/sfris1/Doubly-Robust-Optimization-With-Two-Tower-Models/results/real_targets/+launcher=slurmcpu,data.preprocessor.top_x=25,data=istella,experiment=real_targets,ips.model=dr,ips.n_sessions=100000,policy_temperature=0.5,propensity_model=frequency-based,random_state=45
    choices:
      launcher: slurmcpu
      ips: default
      propensity_model: frequency-based
      relevance_tower: deep
      bias_tower: embedding
      logging_policy_sampler: e_greedy
      logging_policy_ranker: deep
      data: istella
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: submitit_slurm
      hydra/output: default
  verbose: false
