hydra:
  run:
    dir: .
  sweep:
    dir: results/${experiment}
    subdir: ${hydra.job.override_dirname}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - experiment=real_targets
    - data=mslr30k
    - random_state=42
    - policy_temperature=0.5
    - propensity_model=MLPregression
    - ips.model=ips
    - ips.n_sessions=10000
    - +launcher=local
  job:
    name: run
    chdir: true
    override_dirname: +launcher=local,data=mslr30k,experiment=real_targets,ips.model=ips,ips.n_sessions=10000,policy_temperature=0.5,propensity_model=MLPregression,random_state=42
    id: '0'
    num: 0
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys:
        - relevance
        - num_groups
        - D
        - s_group
        - label_type
        - bias_type
        - query_sampling_ratios
        - propensity_classifier_layers
        - propensity_classifier_hidden_units
        - propensity_classifier_dropout
        - cosine_threshold
        - euclidean_threshold
        - kmeans_iters
        - min_cluster_size
        - kmeans_iters
        - query_sampling_ratios
        - knn_k
        - ips.output_path
        - ips.save_subdir
        - ips.position_bias.csv.path
        - ips.position_bias.export_path
        - ips.model_params.eps
        - ips.model_params.model_output_multiplier
        - ips.model_params.relevance_tower.layers
        - ips.model_params.relevance_tower.hidden_units
        - ips.model_params.relevance_tower.dropout
        - ips.trainer.trainer_type
        - ips.trainer.max_epochs
        - ips.trainer.early_stop_diff
        - ips.trainer.early_stop_per_epochs
        - ips.trainer.n_eval_samples
        - ips.trainer.n_samples
        - ips.trainer.learning_rate
        - ips.trainer.clip_multiplier
        - ips.trainer.print_updates
        - ips.propensity.checkpoint_dir
        - ips.propensity.debug_compare_true
        - ips.propensity.dataloader
        - propensity_model.regression.layers
        - propensity_model.regression.hidden_units
        - propensity_model.regression.dropout
        - propensity_model.classifier.layers
        - propensity_model.classifier.hidden_units
        - propensity_model.classifier.dropout
        - ips.force_single_sample
        - data.preprocessor.max_documents_per_query
        - propensity_model.knn.knn_k
        - propensity_model.cosine.cosine_threshold
        - propensity_model.cosine.knn_k
        - propensity_model.euclidean.euclidean_threshold
        - propensity_model.euclidean.knn_k
        - propensity_model.kmeans.num_groups
        - propensity_model.kmeans.min_cluster_size
        - propensity_model.kmeans.kmeans_iters
  runtime:
    version: 1.3.3
    version_base: '1.3'
    cwd: /Users/stanf/Documents/Uni/MSc Thesis/feature-based-propensities-for-ULTR
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /Users/stanf/Documents/Uni/MSc Thesis/feature-based-propensities-for-ULTR/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /Users/stanf/Documents/Uni/MSc Thesis/feature-based-propensities-for-ULTR/results/real_targets/+launcher=local,data=mslr30k,experiment=real_targets,ips.model=ips,ips.n_sessions=10000,policy_temperature=0.5,propensity_model=MLPregression,random_state=42
    choices:
      launcher: local
      ips: default
      propensity_model: MLPregression
      logging_policy_sampler: e_greedy
      logging_policy_ranker: deep
      data: mslr30k
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
