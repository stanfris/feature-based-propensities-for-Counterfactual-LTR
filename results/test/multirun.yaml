hydra:
  run:
    dir: .
  sweep:
    dir: results/${experiment}
    subdir: ${hydra.job.override_dirname}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - experiment=test
    - data=mslr30k
    - random_state=42
    - propensity_model=frequency-based
    - ips.n_session_percentage=0.1
    - ips.model=ips
    - ips.trainer.max_epochs=20
    - data.preprocessor.top_x=20
    - ips.debug=true
  job:
    name: run
    chdir: true
    override_dirname: data.preprocessor.top_x=20,data=mslr30k,experiment=test,ips.debug=true,ips.model=ips,ips.n_session_percentage=0.1,propensity_model=frequency-based,random_state=42
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys:
        - relevance
        - num_groups
        - D
        - s_group
        - label_type
        - bias_type
        - query_sampling_ratios
        - propensity_classifier_layers
        - propensity_classifier_hidden_units
        - propensity_classifier_dropout
        - cosine_threshold
        - euclidean_threshold
        - kmeans_iters
        - min_cluster_size
        - kmeans_iters
        - query_sampling_ratios
        - knn_k
        - ips.output_path
        - ips.save_subdir
        - ips.position_bias.csv.path
        - ips.position_bias.export_path
        - ips.model_params.eps
        - ips.model_params.model_output_multiplier
        - ips.model_params.relevance_tower.layers
        - ips.model_params.relevance_tower.hidden_units
        - ips.model_params.relevance_tower.dropout
        - ips.trainer.trainer_type
        - ips.trainer.max_epochs
        - ips.trainer.early_stop_diff
        - ips.trainer.early_stop_per_epochs
        - ips.trainer.n_eval_samples
        - ips.trainer.n_samples
        - ips.trainer.learning_rate
        - ips.trainer.clip_multiplier
        - ips.trainer.print_updates
        - ips.propensity.checkpoint_dir
        - ips.propensity.debug_compare_true
        - ips.propensity.dataloader
        - propensity_model.regression.layers
        - propensity_model.regression.hidden_units
        - propensity_model.regression.dropout
        - propensity_model.classifier.layers
        - propensity_model.classifier.hidden_units
        - propensity_model.classifier.dropout
        - ips.force_single_sample
        - data.preprocessor.max_documents_per_query
        - propensity_model.knn.knn_k
        - propensity_model.cosine.cosine_threshold
        - propensity_model.cosine.knn_k
        - propensity_model.euclidean.euclidean_threshold
        - propensity_model.euclidean.knn_k
        - propensity_model.kmeans.num_groups
        - propensity_model.kmeans.min_cluster_size
        - propensity_model.kmeans.kmeans_iters
  runtime:
    version: 1.3.3
    version_base: '1.3'
    cwd: /Users/stanf/Documents/Uni/MSc Thesis/feature-based-propensities-for-ULTR
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /Users/stanf/Documents/Uni/MSc Thesis/feature-based-propensities-for-ULTR/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      ips: default
      propensity_model: frequency-based
      logging_policy_sampler: e_greedy
      logging_policy_ranker: deep
      data: mslr30k
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
dataset_dir: ${oc.env:LTR_DATASET_DIR,./data}
experiment: test
random_state: 42
device: cpu
use_cross_validation: false
features: all
relevance: original
relevance_noise: 0.0
relevance_quantization: false
drop0rel: false
train_clicks: 5000000
val_clicks: 2500000
test_set_mode: label_only
test_clicks: 500000
persist_datasets: false
policy_strength: 1.0
policy_temperature: 0.0
bias_strength: 1.0
query_sampling_ratios: null
simulation:
  max_label: 10
deterministic_groups: false
use_wandb: false
data:
  dataset:
    _target_: feature_based_propensities_for_ULTR.data.datasets.mslr.MSLR30K
    base_dir: ${dataset_dir}
  preprocessor:
    _target_: feature_based_propensities_for_ULTR.data.preprocessing.Preprocessor
    normalize_features: true
    generate_query_document_ids: true
    store_separate_lp_query_doc_features: false
    documents_per_chunk: 25
    top_x: 20
    max_documents_per_query: 200
    disjoint_query_chunk_mode: false
    drop0rel: ${drop0rel}
    random_state: ${random_state}
    relevance: ${relevance}
    features: ${features}
    relevance_noise: ${relevance_noise}
    relevance_quantization: ${relevance_quantization}
logging_policy_ranker:
  _target_: feature_based_propensities_for_ULTR.simulation.simulator.NeuralRanker
  model_type: deep
  policy_strength: ${policy_strength}
  random_state: ${random_state}
  training_data_percentage: 10.0
logging_policy_sampler:
  _target_: feature_based_propensities_for_ULTR.simulation.simulator.EGreedySampler
  policy_temperature: ${policy_temperature}
  random_state: ${random_state}
propensity_model:
  type: frequency-based
ips:
  model: ips
  output_path: ips_results.json
  save_subdir: ips_datasets
  n_sessions: 100000
  n_session_percentage: 0.1
  force_single_sample: false
  display_histogram_dir: display_histograms
  display_histogram_max: 100
  debug: true
  debug_max_samples: 25
  debug_feature_head: 5
  model_params:
    eps: 1.0e-08
    model_output_multiplier: 1.0
    relevance_tower:
      layers: 2
      hidden_units: 32
      dropout: 0.1
  regression:
    method: regression
    model:
      layers: 3
      hidden_units: 256
      dropout: 0.1
    trainer:
      batch_size: 1024
      inference_batch_size: 16384
      max_epochs: 200
      early_stop_diff: 0.001
      early_stop_per_epochs: 3
      learning_rate: 0.001
      eps: 1.0e-06
      print_updates: true
      rescale_to_target_mean: false
      rescale_target_mean: 0.5
  trainer:
    trainer_type: pl-rank
    max_epochs: 20
    early_stop_diff: 0.001
    early_stop_per_epochs: 3
    early_stop_min_epochs: 15
    patience: 2
    eval_first_epoch: false
    eval_train_split: false
    eval_max_queries: ${oc.select:data.data_eval_max_queries,null}
    n_grad_samples_dynamic_fallback: 100
    n_eval_samples: ${oc.select:data.data_n_eval_samples,100}
    n_samples: 100
    learning_rate: 1.0e-05
    clip_multiplier: 1.0
    clip_base: 10.0
    clip_propensity: false
    print_updates: true
    use_wandb: false
    log_freq: 100
  eval_label_scale: 0.25
  click_prediction_eval:
    enabled: false
    output_path: click_prediction_test.npz
  position_bias:
    source: oracle
    base_epsilon: 0.001
    csv:
      path: null
      method: null
    export_path: ultr_position_bias_estimates.csv
  propensity:
    method: ${propensity_model.type}
    checkpoint_dir: classifier_propensity_model_checkpoint
    max_train_samples: 50000
    inference_batch_size: 512
    debug_compare_true: false
    dataloader:
      num_workers: 1
      prefetch_factor: 2
      persistent_workers: true
      pin_memory: false
