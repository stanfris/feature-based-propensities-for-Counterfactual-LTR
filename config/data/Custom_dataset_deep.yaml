dataset:
  _target_: feature_based_propensities_for_ULTR.data.datasets.custom.CustomDatasetDeep
  base_dir: "${dataset_dir}"
  num_groups: ${num_groups}
  docs_per_group: ${docs_per_group}
  D: ${D}
  s_group: ${s_group}
  s_doc: ${s_doc}
  random_seed: ${random_state}
  num_queries: ${num_queries}

preprocessor:
  _target_: feature_based_propensities_for_ULTR.data.preprocessing.Preprocessor
  normalize_features: True
  generate_query_document_ids: True
  store_separate_lp_query_doc_features: False
  documents_per_chunk: 10
  top_x: 10
  max_documents_per_query: 200
  disjoint_query_chunk_mode: False
  drop0rel: ${drop0rel}
  random_state: ${random_state}
  relevance: ${relevance}
  features: ${features}
  relevance_noise: ${relevance_noise}
  relevance_quantization: ${relevance_quantization}
