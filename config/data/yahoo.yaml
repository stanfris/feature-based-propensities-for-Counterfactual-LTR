dataset:
  _target_: feature_based_propensities_for_ULTR.data.datasets.yahoo.YahooC14
  base_dir: "${dataset_dir}"

preprocessor:
  _target_: feature_based_propensities_for_ULTR.data.preprocessing.Preprocessor
  normalize_features: False
  generate_query_document_ids: True
  store_separate_lp_query_doc_features: False
  disjoint_query_chunk_mode: False
  documents_per_chunk: 25 # only applies when document chunking is applied.
  top_x: 25 # top-k ranking mode, how many documents is the ranking over.
  max_documents_per_query: 80 # optional cap on total candidate docs retained per query.
  drop0rel: ${drop0rel}
  random_state: ${random_state}
  relevance: ${relevance}
  features: ${features}
  relevance_noise: ${relevance_noise}
  relevance_quantization: ${relevance_quantization}
